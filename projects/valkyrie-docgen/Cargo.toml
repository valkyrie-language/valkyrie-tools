[package]
name = "valkyrie-docgen"
version = "0.1.0"
edition = "2024"

[dependencies]
valkyrie-ast = { path = "../valkyrie-ast" }
valkyrie-parser = { path = "../valkyrie-parser" }
valkyrie-error = { path = "../valkyrie-error" }
valkyrie-types = { path = "../valkyrie-types" }
valkyrie-compiler = { path = "../valkyrie-compiler" }
valkyrie-runtime = { path = "../valkyrie-runtime" }
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
maud = "0.26"
tracing = "0.1"
tracing-subscriber = "0.3"
slug = "0.1"
chrono = "0.4"
